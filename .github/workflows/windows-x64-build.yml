name: Windows x64 Build & Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "tools/website/**"
      - "i18n/site/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: win-x64-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-win-x64:
    name: Windows x64 (test + exe)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: win-x64-dev-${{ hashFiles('Cargo.lock') }}
          restore-keys: win-x64-dev-

      - name: NASM
        shell: pwsh
        run: |
          choco install nasm --version 2.16.3 --no-progress -y
          "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Check i18n catalog
        run: |
          python tools/i18n/extract.py
          git diff --exit-code -- i18n/en.tsv

      - name: Clippy (mdm-app)
        run: cargo clippy -p mdm-app --all-targets -- -D warnings

      - name: Test (mdm-app)
        run: cargo test -p mdm-app --bin misterdownloadmanager

      - name: Build release exe
        run: cargo build --release -p mdm-app --bin misterdownloadmanager

      - name: Upload misterdownloadmanager.exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: misterdownloadmanager-win-x64
          path: target/release/misterdownloadmanager.exe
          retention-days: 14
